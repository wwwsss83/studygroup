  <!-- ES Modules Import Map -->

<body>
  <div id="root"></div>

  <!-- 메인 애플리케이션 스크립트 -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      MapPin, BookOpen, Users, Search, User, ChevronRight,

      Eye, EyeOff, Edit2, Camera, Upload, ChevronDown, ChevronUp

    // Firebase Imports
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { 
      getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

      updateDoc, arrayUnion, addDoc 
    } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // --- [Firebase 초기화] ---

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'studyzone-default-id';

    // --- [상수 데이터] ---
    const PUBLISHERS = ['천재교육', '비상교육', '미래엔', '동아출판', '지학사', '선택 안 함'];
    const TIME_SLOTS = ['평일 방과후', '평일 밤(야자 후)', '주말 오전', '주말 오후/저녁'];
    const PLACE_PREFS = ['스터디카페', '시/구립 도서관', '일반 카페', '온라인(디스코드)'];

    const REGIONS = {
      '서울특별시': ['강남구', '강동구', '강북구', '강서구', '관악구', '광진구', '구로구', '금천구', '노원구', '도봉구', '동대문구', '동작구', '마포구', '서대문구', '서초구', '성동구', '성북구', '송파구', '양천구', '영등포구', '용산구', '은평구', '종로구', '중구', '중랑구'],
      '경기도': ['가평군', '고양시', '과천시', '광명시', '광주시', '구리시', '군포시', '김포시', '남양주시', '동두천시', '부천시', '성남시', '수원시', '시흥시', '안산시', '안성시', '안양시', '양주시', '양평군', '여주시', '연천군', '오산시', '용인시', '의왕시', '의정부시', '이천시', '파주시', '평택시', '포천시', '하남시', '화성시'],
      '인천광역시': ['강화군', '계양구', '남동구', '동구', '미추홀구', '부평구', '서구', '연수구', '옹진군', '중구'],
      '부산광역시': ['강서구', '금정구', '기장군', '남구', '동구', '동래구', '부산진구', '북구', '사상구', '사하구', '서구', '수영구', '연제구', '영도구', '중구', '해운대구'],
      '대구광역시': ['남구', '달서구', '달성군', '동구', '북구', '서구', '수성구', '중구', '군위군'],
      '광주광역시': ['광산구', '남구', '동구', '북구', '서구'],
      '대전광역시': ['대덕구', '동구', '서구', '유성구', '중구'],
      '울산광역시': ['남구', '동구', '북구', '울주군', '중구'],
      '세종특별자치시': ['세종특별자치시'],
      '강원특별자치도': ['강릉시', '고성군', '동해시', '삼척시', '속초시', '양구군', '양양군', '영월군', '원주시', '인제군', '정선군', '철원군', '춘천시', '태백시', '평창군', '홍천군', '화천군', '횡성군'],
      '충청북도': ['괴산군', '단양군', '보은군', '영동군', '옥천군', '음성군', '제천시', '증평군', '진천군', '청주시', '충주시'],
      '충청남도': ['계룡시', '공주시', '금산군', '논산시', '당진시', '보령시', '부여군', '서산시', '서천군', '아산시', '예산군', '천안시', '청양군', '태안군', '홍성군'],
      '전북특별자치도': ['고창군', '군산시', '김제시', '남원시', '무주군', '부안군', '순창군', '완주군', '익산시', '임실군', '장수군', '전주시', '정읍시', '진안군'],
      '전라남도': ['강진군', '고흥군', '곡성군', '광양시', '구례군', '나주시', '담양군', '목포시', '무안군', '보성군', '순천시', '신안군', '여수시', '영광군', '영암군', '완도군', '장성군', '장흥군', '진도군', '함평군', '해남군', '화순군'],
      '경상북도': ['경산시', '경주시', '고령군', '구미시', '김천시', '문경시', '봉화군', '상주시', '성주군', '안동시', '영덕군', '영양군', '영주시', '영천시', '예천군', '울릉군', '울진군', '의성군', '청도군', '청송군', '칠곡군', '포항시'],
      '경상남도': ['거제시', '거창군', '고성군', '김해시', '남해군', '밀양시', '사천시', '산청군', '양산시', '의령군', '진주시', '창녕군', '창원시', '통영시', '하동군', '함안군', '함양군', '합천군'],
      '제주특별자치도': ['서귀포시', '제주시']
    };

    const SUBJECT_CATEGORIES = {
      '중등': {
        '국어': ['국어'],
        '영어': ['영어'],
        '수학': ['수학'],
        '과학': ['과학'],
        '사회': ['사회', '역사'],
        '한국사': ['한국사']
      },
      '고등': {
        '국어': ['국어(공통)', '화법과 작문', '언어와 매체', '문학', '독서'],
        '영어': ['영어(공통)', '영어 I', '영어 II', '영어 회화', '영어 독해와 작문'],
        '수학': ['수학(상/하)', '수학 I', '수학 II', '미적분', '확률과 통계', '기하'],
        '과학': ['통합과학', '물리학 I', '물리학 II', '화학 I', '화학 II', '생명과학 I', '생명과학 II', '지구과학 I', '지구과학 II'],
        '사회': ['통합사회', '한국지리', '세계지리', '세계사', '동아시아사', '경제', '정치와 법', '사회·문화', '생활과 윤리', '윤리와 사상'],
        '한국사': ['한국사']
      }
    };

    function App() {
      const [authUser, setAuthUser] = useState(null);
      const [isAuthReady, setIsAuthReady] = useState(false);
      const [isLoggedIn, setIsLoggedIn] = useState(false); 
      const [isProcessing, setIsProcessing] = useState(false);
      
      const [currentView, setCurrentView] = useState('home'); 
      const [onboardingStep, setOnboardingStep] = useState(1);
      const [activeTab, setActiveTab] = useState('recommend'); 
      
      // 로그인 & 회원가입 폼
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [showLoginPassword, setShowLoginPassword] = useState(false);

      const [signupEmail, setSignupEmail] = useState('');
      const [signupPassword, setSignupPassword] = useState('');
      const [signupPasswordConfirm, setSignupPasswordConfirm] = useState('');
      const [showSignupPassword, setShowSignupPassword] = useState(false);
      const [showSignupPasswordConfirm, setShowSignupPasswordConfirm] = useState(false);

      // 개설 폼
      const [createTitle, setCreateTitle] = useState('');
      const [createMaxMembers, setCreateMaxMembers] = useState(4);
      const [createDesc, setCreateDesc] = useState('');
      const [createDDayName, setCreateDDayName] = useState('');
      const [createDDayDate, setCreateDDayDate] = useState('');

      // 지역 선택
      const [sido, setSido] = useState('');
      const [sigungu, setSigungu] = useState('');
      const [dong, setDong] = useState('');
      const [expandedSubjectCat, setExpandedSubjectCat] = useState('');

      // 학생 인증 이미지
      const [isUploadingID, setIsUploadingID] = useState(false);
      const [uploadedFile, setUploadedFile] = useState(null);
      const [uploadedFileUrl, setUploadedFileUrl] = useState(null);
      const fileInputRef = useRef(null);

      const [messages, setMessages] = useState([]);
      const [newMessage, setNewMessage] = useState('');
      const chatScrollRef = useRef(null);

      const [userProfile, setUserProfile] = useState(null);
      const [tempProfile, setTempProfile] = useState({
        name: '', school: '', grade: '', subjects: [], publishers: [], style: '', times: [], place: ''
      });
      const [allGroups, setAllGroups] = useState([]);
      const [selectedGroup, setSelectedGroup] = useState(null);

      const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'alert', onConfirm: null });
      const showModal = (title, message, type = 'alert', onConfirm = null) => setModal({ isOpen: true, title, message, type, onConfirm });
      const closeModal = () => setModal({ ...modal, isOpen: false });

      const toggleArray = (arr = [], item) => arr.includes(item) ? arr.filter(i => i !== item) : [...arr, item];

      // --- [1. 인증 초기화 및 잠금장치] ---
      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) await signInWithCustomToken(auth, window.__initial_auth_token);
            else await signInAnonymously(auth); 
          } catch (error) { console.error("Auth init error:", error); }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, async (user) => {
          if (!user) return; 

          setAuthUser(user);
          let savedEmail = localStorage.getItem('studyzone_ui_email');

          try {
            const accountRef = doc(db, 'artifacts', appId, 'users', user.uid, 'account', 'data');
            const accountSnap = await getDoc(accountRef);
            if (accountSnap.exists() && accountSnap.data().isUILoggedIn) {
              savedEmail = accountSnap.data().email;
              localStorage.setItem('studyzone_ui_email', savedEmail);
            } else if (accountSnap.exists() && accountSnap.data().isUILoggedIn === false) {
              savedEmail = null;
              localStorage.removeItem('studyzone_ui_email');
            }
          } catch(e) { console.error("Account fetch error:", e); }

          if (savedEmail) {
            const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
            try {
              const profileSnap = await getDoc(profileRef);
              if (profileSnap.exists()) {
                setUserProfile(profileSnap.data());
                setIsLoggedIn(true);
                setCurrentView('home');
              } else {
                setIsLoggedIn(true);
                setCurrentView('onboarding');
              }
            } catch (error) { console.error("Profile fetch error:", error); }
          } else {
            setIsLoggedIn(false);
          }
          setIsAuthReady(true);
        });
        return () => unsubscribe();
      }, []);

      // --- [2. 데이터 동기화] ---
      useEffect(() => {
        if (!authUser || !isLoggedIn) return;

        const groupsRef = collection(db, 'artifacts', appId, 'public', 'data', 'groups');
        const unsubscribeGroups = onSnapshot(groupsRef, (snapshot) => {
          const groupsData = [];
          snapshot.forEach(doc => groupsData.push({ id: doc.id, ...doc.data() }));
          setAllGroups(groupsData);
        }, (error) => {
          console.error("Groups fetch error:", error);
        });
        return () => unsubscribeGroups();
      }, [authUser, isLoggedIn]);

      useEffect(() => {
        if (currentView === 'chat' && selectedGroup && authUser) {
          const chatRef = collection(db, 'artifacts', appId, 'public', 'data', `chat_${selectedGroup.id}`);
          const unsubscribeChat = onSnapshot(chatRef, (snapshot) => {
            const msgs = [];
            snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
            msgs.sort((a, b) => a.timestamp - b.timestamp);
            setMessages(msgs);
            setTimeout(() => { if (chatScrollRef.current) chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight; }, 100);
          }, (error) => {
             console.error("Chat fetch error:", error);
          });
          return () => unsubscribeChat();
        }
      }, [currentView, selectedGroup, authUser]);

      // --- [핸들러: 분리된 회원가입 / 로그인] ---
      const handleLogin = async (e) => {
        e.preventDefault();
        if (!loginEmail || !loginPassword) return showModal('알림', '이메일과 비밀번호를 모두 입력해주세요.');
        
        setIsProcessing(true);
        try {
          const accountRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'account', 'data');
          const accountSnap = await getDoc(accountRef);

          if (!accountSnap.exists() || accountSnap.data().email !== loginEmail || accountSnap.data().password !== loginPassword) {
            setIsProcessing(false);
            return showModal('로그인 실패', '가입되지 않은 이메일이거나 비밀번호가 일치하지 않습니다.');
          }

          await updateDoc(accountRef, { isUILoggedIn: true });
          localStorage.setItem('studyzone_ui_email', loginEmail);
          
          const profileRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'profile', 'data');
          const profileSnap = await getDoc(profileRef);
          if (profileSnap.exists()) {
            setUserProfile(profileSnap.data());
            setCurrentView('home');
          } else {
            setCurrentView('onboarding');
          }
          setIsLoggedIn(true);
        } catch (error) {
          showModal('오류', '로그인 처리 중 문제가 발생했습니다.');
        }
        setIsProcessing(false);
      };

      const handleSignUp = async (e) => {
        e.preventDefault();
        if (!signupEmail || !signupPassword || !signupPasswordConfirm) return showModal('알림', '모든 항목을 입력해주세요.');
        if (signupPassword.length < 6) return showModal('알림', '비밀번호는 6자리 이상이어야 합니다.');
        if (signupPassword !== signupPasswordConfirm) return showModal('알림', '비밀번호 확인이 일치하지 않습니다.');

        setIsProcessing(true);
        try {
          const accountRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'account', 'data');
          const accountSnap = await getDoc(accountRef);

          if (accountSnap.exists() && accountSnap.data().email === signupEmail) {
            setIsProcessing(false);
            return showModal('가입 불가', '이미 등록된 이메일 계정이 존재합니다. 로그인 페이지를 이용해주세요.');
          }

          await setDoc(accountRef, { email: signupEmail, password: signupPassword, isUILoggedIn: true });
          localStorage.setItem('studyzone_ui_email', signupEmail);
          setIsLoggedIn(true);
          setCurrentView('onboarding');
        } catch (error) {
          showModal('오류', '회원가입 처리 중 문제가 발생했습니다.');
        }
        setIsProcessing(false);
      };

      const handleLogout = () => {
        showModal('로그아웃', '정말 로그아웃 하시겠습니까?', 'confirm', async () => {
          try {
            const accountRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'account', 'data');
            await updateDoc(accountRef, { isUILoggedIn: false });
          } catch(e) { console.error(e); }

          localStorage.removeItem('studyzone_ui_email');
          setUserProfile(null);
          setLoginEmail('');
          setLoginPassword('');
          setSignupEmail('');
          setSignupPassword('');
          setSignupPasswordConfirm('');
          setShowLoginPassword(false);
          setShowSignupPassword(false);
          setShowSignupPasswordConfirm(false);
          setActiveTab('recommend');
          setIsLoggedIn(false);
        });
      };

      // --- [거리 계산 시뮬레이션 로직 (반경 5km 구현용)] ---
      const getSimulatedDistance = (loc1, loc2) => {
        if (!loc1 || !loc2) return 15.0;
        const clean1 = loc1.trim();
        const clean2 = loc2.trim();
        if (clean1 === clean2) return 0.8;
        const parts1 = clean1.split(' ');
        const parts2 = clean2.split(' ');
        if (parts1[0] === parts2[0] && parts1[1] === parts2[1]) return 3.2;
        if (parts1[0] === parts2[0]) return 12.5; 
        return 50.0;
      };

      // --- [핸들러: 온보딩 로직 & 유효성 체크] ---
      const handleOnboardingNext = async () => {
        if (onboardingStep === 1) {
          const currentName = tempProfile.name || '';
          const currentSchool = tempProfile.school || '';
          const currentGrade = tempProfile.grade || '';

          if (!currentName.trim()) return showModal('알림', '닉네임을 입력해주세요.');
          if (!currentSchool.trim()) return showModal('알림', '학교 이름을 입력해주세요.');
          if (!currentGrade) return showModal('알림', '학년을 선택해주세요.');
          if (currentName.includes('/')) return showModal('경고', '닉네임에 특수문자는 사용할 수 없습니다.');
          
          setIsProcessing(true);
          try {
            const nickRef = doc(db, 'artifacts', appId, 'public', 'data', 'nicknames', currentName.trim());
            const nickSnap = await getDoc(nickRef);
            if (nickSnap.exists() && nickSnap.data().uid !== authUser?.uid) {
              setIsProcessing(false);
              return showModal('중복 알림', `'${currentName}'(은)는 이미 누군가 사용 중인 닉네임입니다.\n다른 닉네임을 입력해주세요.`);
            }
          } catch(e) { console.error("Nickname check error", e); }
          setIsProcessing(false);
        }

        if (onboardingStep === 2 && (tempProfile.subjects || []).length === 0) {
          return showModal('알림', '관심 있는 공부를 최소 1개 이상 선택해주세요.');
        }
        if (onboardingStep === 3 && (tempProfile.publishers || []).length === 0) {
          return showModal('알림', '사용 중인 교과서나 참고서 출판사를 선택해주세요.');
        }
        if (onboardingStep === 4) {
          if ((tempProfile.times || []).length === 0) return showModal('알림', '선호하는 시간대를 선택해주세요.');
          if (!tempProfile.place) return showModal('알림', '선호하는 모임 장소를 선택해주세요.');
        }
        if (onboardingStep === 5 && !tempProfile.style) {
          return showModal('알림', '선호하는 스터디 분위기를 선택해주세요.');
        }

        if (onboardingStep === 6) {
          if (!sido || !sigungu || !dong.trim()) {
            return showModal('알림', "지역(시/도, 시/군/구, 읍/면/동)을 모두 입력해주세요.");
          }
          setIsProcessing(true);
          await handleSaveProfile();
          setIsProcessing(false);
          return;
        }
        
        setOnboardingStep(prev => prev + 1);
      };

      const handleSaveProfile = async () => {
        if (!authUser) return;
        try {
          const finalEmail = localStorage.getItem('studyzone_ui_email') || '';
          const finalProfile = { 
            ...tempProfile, 
            name: (tempProfile.name || '').trim(), 
            school: (tempProfile.school || '').trim(), 
            location: `${sido} ${sigungu} ${dong.trim()}`.trim(), 
            isStudentVerified: false, 
            mannerScore: 36.5, 
            email: finalEmail 
          };
          
          const profileRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'profile', 'data');
          await setDoc(profileRef, finalProfile);
          
          const nickRef = doc(db, 'artifacts', appId, 'public', 'data', 'nicknames', finalProfile.name);
          await setDoc(nickRef, { uid: authUser.uid });

          setUserProfile(finalProfile);
          setCurrentView('home');
        } catch (error) {
          showModal('오류', '프로필 저장 중 문제가 발생했습니다.');
        }
      };

      // --- [핸들러: 프로필 수정 로직] ---
      const handleOpenEditProfile = () => {
        setTempProfile({ ...userProfile });
        const locationParts = (userProfile.location || '').split(' ');
        setSido(locationParts[0] || '');
        setSigungu(locationParts[1] || '');
        setDong(locationParts.slice(2).join(' ') || '');
        setExpandedSubjectCat('');
        setCurrentView('editProfile');
      };

      const handleUpdateProfile = async () => {
        const currentName = tempProfile.name || '';
        const currentSchool = tempProfile.school || '';

        if (!currentName.trim()) return showModal('알림', '닉네임을 입력해주세요.');
        if (!currentSchool.trim()) return showModal('알림', '학교 이름을 입력해주세요.');
        if (!sido || !sigungu || !dong.trim()) return showModal('알림', "지역(시/도, 시/군/구, 읍/면/동)을 모두 입력해주세요.");
        
        setIsProcessing(true);
        try {
          if (currentName !== userProfile.name) {
            const nickRef = doc(db, 'artifacts', appId, 'public', 'data', 'nicknames', currentName.trim());
            const nickSnap = await getDoc(nickRef);
            if (nickSnap.exists() && nickSnap.data().uid !== authUser?.uid) {
              setIsProcessing(false);
              return showModal('중복 알림', `'${currentName}'(은)는 이미 누군가 사용 중인 닉네임입니다.\n다른 닉네임을 입력해주세요.`);
            }
            await setDoc(nickRef, { uid: authUser.uid });
          }

          const updatedProfile = {
            ...userProfile, 
            ...tempProfile,
            name: currentName.trim(),
            school: currentSchool.trim(),
            location: `${sido} ${sigungu} ${dong.trim()}`.trim(),
          };

          const profileRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'profile', 'data');
          await updateDoc(profileRef, updatedProfile);

          setUserProfile(updatedProfile);
          showModal('수정 완료', '프로필이 성공적으로 업데이트 되었습니다.');
          setCurrentView('home');
          setActiveTab('profile'); 
        } catch (error) {
          showModal('오류', '프로필 업데이트 중 문제가 발생했습니다.');
        }
        setIsProcessing(false);
      };

      // --- [핸들러: 학생증 인증 실제 파일 업로드 로직] ---
      const handleFileChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          setUploadedFile(file);
          setUploadedFileUrl(URL.createObjectURL(file));
        }
      };

      const handleVerifyStudentSubmit = () => {
        if (!uploadedFile) {
          return showModal('알림', '학생증 등 증빙 서류 이미지를 업로드해주세요.');
        }
        setIsUploadingID(true);
        
        setTimeout(async () => {
          try {
            const profileRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'profile', 'data');
            await updateDoc(profileRef, { isStudentVerified: true });
            
            setUserProfile(prev => ({ ...prev, isStudentVerified: true }));
            setIsUploadingID(false);
            setUploadedFile(null);
            setUploadedFileUrl(null);
            
            showModal('인증 승인 완료 🎉', '학생 인증이 성공적으로 완료되어 배지가 부여되었습니다!\n이제 더욱 신뢰도 높은 스터디 매칭이 가능합니다.');
            setCurrentView('home');
            setActiveTab('profile');
          } catch (error) {
            setIsUploadingID(false);
            showModal('오류', '인증 처리 중 문제가 발생했습니다.');
          }
        }, 1500);
      };

      // --- [핸들러: 스터디 기능] ---
      const handleCreateGroup = async () => {
        if (!authUser || !userProfile) return;
        
        if (!createTitle.trim()) return showModal('알림', '스터디 제목을 입력해주세요.');
        if (!createDesc.trim()) return showModal('알림', '상세 설명 및 규칙을 입력해주세요.');

        setIsProcessing(true);
        try {
          const groupsRef = collection(db, 'artifacts', appId, 'public', 'data', 'groups');
          const newGroupData = {
            title: createTitle, maxMembers: createMaxMembers, description: createDesc,
            grade: userProfile.grade || '미설정', subjects: userProfile.subjects || [],
            publishers: userProfile.publishers || [], style: userProfile.style || '미설정',
            location: userProfile.location || '미설정', place: userProfile.place || '스터디카페', times: userProfile.times || [],
            targetDDayName: createDDayName, targetDDayDate: createDDayDate, status: 'open',
            notice: '환영합니다! 공지사항을 등록해주세요.', tags: [userProfile.subjects?.[0]?.split('(')[0] || '스터디', '신규개설'],
            hostId: authUser.uid, currentMembers: 1,
            members: [{ uid: authUser.uid, name: userProfile.name, grade: userProfile.grade, role: 'host', mannerScore: userProfile.mannerScore, isStudentVerified: userProfile.isStudentVerified }],
            createdAt: new Date().toISOString()
          };
          await addDoc(groupsRef, newGroupData);
          setCreateTitle(''); setCreateDesc(''); setCreateDDayName(''); setCreateDDayDate('');
          setCurrentView('home');
          setActiveTab('myGroups');
        } catch (error) { showModal('오류', '그룹 생성 실패'); }
        setIsProcessing(false);
      };

      const handleJoinGroup = async () => {
        if (!authUser || !userProfile || !selectedGroup) return;
        const liveGroup = allGroups.find(g => g.id === selectedGroup.id) || selectedGroup;
        if (liveGroup.status === 'closed' || liveGroup.currentMembers >= liveGroup.maxMembers) return showModal('마감', '현재 모집이 마감된 스터디입니다.');
        
        setIsProcessing(true);
        const groupRef = doc(db, 'artifacts', appId, 'public', 'data', 'groups', selectedGroup.id);
        await updateDoc(groupRef, {
          currentMembers: selectedGroup.currentMembers + 1,
          members: arrayUnion({ uid: authUser.uid, name: userProfile.name, grade: userProfile.grade, role: 'member', mannerScore: userProfile.mannerScore, isStudentVerified: userProfile.isStudentVerified })
        });
        showModal('가입 완료 🎉', '성공적으로 가입되었습니다!\n채팅방에서 인사를 건네보세요.');
        setIsProcessing(false);
        setCurrentView('home');
        setActiveTab('myGroups');
      };

      const handleLeaveGroup = async () => {
        if (!authUser || !selectedGroup) return;
        showModal('스터디 탈퇴', '정말로 이 스터디에서 탈퇴하시겠습니까?', 'confirm', async () => {
          try {
            const liveGroup = allGroups.find(g => g.id === selectedGroup.id);
            const updatedMembers = liveGroup.members.filter(m => m.uid !== authUser.uid);
            const groupRef = doc(db, 'artifacts', appId, 'public', 'data', 'groups', selectedGroup.id);
            await updateDoc(groupRef, { currentMembers: updatedMembers.length, members: updatedMembers });
            setCurrentView('home');
          } catch(e) { showModal('오류', '탈퇴 처리 중 문제가 발생했습니다.'); }
        });
      };

      const handleKickMember = async (memberUid, memberName) => {
        showModal('멤버 내보내기', `'${memberName}'님을 스터디에서 정말 내보내시겠습니까?`, 'confirm', async () => {
          const liveGroup = allGroups.find(g => g.id === selectedGroup.id);
          const updatedMembers = liveGroup.members.filter(m => m.uid !== memberUid);
          const groupRef = doc(db, 'artifacts', appId, 'public', 'data', 'groups', selectedGroup.id);
          await updateDoc(groupRef, { currentMembers: updatedMembers.length, members: updatedMembers });
          const chatRef = collection(db, 'artifacts', appId, 'public', 'data', `chat_${selectedGroup.id}`);
          await addDoc(chatRef, { text: `📢 ${memberName}님이 스터디에서 나갔습니다.`, uid: 'system', name: '시스템', timestamp: Date.now() });
        });
      };

      const handleToggleStatus = async () => {
        const liveGroup = allGroups.find(g => g.id === selectedGroup.id);
        const groupRef = doc(db, 'artifacts', appId, 'public', 'data', 'groups', selectedGroup.id);
        await updateDoc(groupRef, { status: liveGroup.status === 'open' ? 'closed' : 'open' });
      };

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!newMessage.trim() || !authUser || !userProfile || !selectedGroup) return;
        const chatRef = collection(db, 'artifacts', appId, 'public', 'data', `chat_${selectedGroup.id}`);
        await addDoc(chatRef, { text: newMessage, uid: authUser.uid, name: userProfile.name, timestamp: Date.now() });
        setNewMessage('');
      };

      // ==========================================
      // UI 렌더링 섹션
      // ==========================================

      const CustomModal = () => {
        if (!modal.isOpen) return null;
        return (
          <div className="absolute inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
            <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl animate-fade-in-up">
              <div className="p-6">
                <div className="flex items-center gap-3 mb-3"><AlertCircle className="w-6 h-6 text-indigo-600" /><h3 className="text-lg font-bold text-gray-900">{modal.title}</h3></div>
                <p className="text-gray-600 text-sm leading-relaxed whitespace-pre-wrap">{modal.message}</p>
              </div>
              <div className="flex border-t border-gray-100 bg-gray-50">
                {modal.type === 'confirm' && <button onClick={closeModal} className="flex-1 py-4 text-gray-500 font-bold text-sm border-r border-gray-100 hover:bg-gray-100">취소</button>}
                <button onClick={() => { closeModal(); if (modal.onConfirm) modal.onConfirm(); }} className="flex-1 py-4 text-indigo-600 font-bold text-sm hover:bg-indigo-50">확인</button>
              </div>
            </div>
          </div>
        );
      };

      if (!isAuthReady) {
        return (
          <div className="max-w-md mx-auto h-screen bg-white flex flex-col items-center justify-center sm:border-x sm:border-gray-200">
            <Loader2 className="w-10 h-10 text-indigo-600 animate-spin mb-4" />
            <p className="text-gray-500 font-medium text-sm">StudyZone 정보를 불러오는 중...</p>
          </div>
        );
      }

      // --- [과목 선택 아코디언 UI] ---
      const renderSubjectSelector = () => {
        const isMiddleSchool = ['중1', '중2', '중3'].includes(tempProfile.grade);
        const categoryData = isMiddleSchool ? SUBJECT_CATEGORIES.중등 : SUBJECT_CATEGORIES.고등;

        return (
          <div className="space-y-3 animate-fade-in-up">
            <p className="text-sm text-gray-500 font-medium mb-1">
              현재 선택된 학년(<span className="font-bold text-indigo-600">{tempProfile.grade}</span>)에 맞는 과목 리스트입니다.
            </p>
            <div className="space-y-3">
              {Object.entries(categoryData).map(([category, subjects]) => {
                const selectedCount = subjects.filter(s => (tempProfile.subjects || []).includes(s)).length;
                const isExpanded = expandedSubjectCat === category;

                return (
                  <div key={category} className="border border-gray-200 rounded-xl overflow-hidden shadow-sm transition-all bg-white">
                    <button
                      type="button"
                      onClick={() => setExpandedSubjectCat(isExpanded ? '' : category)}
                      className="w-full flex justify-between items-center p-4 bg-gray-50 hover:bg-gray-100 transition-colors"
                    >
                      <span className="font-bold text-gray-800">{category}</span>
                      <div className="flex items-center gap-2">
                        {selectedCount > 0 && <span className="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-bold">{selectedCount}개 선택됨</span>}
                        {isExpanded ? <ChevronUp className="w-5 h-5 text-gray-500" /> : <ChevronDown className="w-5 h-5 text-gray-500" />}
                      </div>
                    </button>
                    {isExpanded && (
                      <div className="p-4 flex flex-wrap gap-2 border-t border-gray-100">
                        {subjects.map(subject => {
                          const isSelected = (tempProfile.subjects || []).includes(subject);
                          return (
                            <button
                              key={subject}
                              onClick={() => setTempProfile(p => ({...p, subjects: toggleArray(p.subjects, subject)}))}
                              className={`px-3 py-2 rounded-full border text-xs font-bold transition-colors ${isSelected ? 'border-indigo-600 bg-indigo-600 text-white shadow-md shadow-indigo-100' : 'border-gray-200 text-gray-700 bg-white hover:bg-gray-50'}`}
                            >
                              {subject}
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      // --- [화면: 로그인 전용 뷰] ---
      const renderLogin = () => (
        <div className="flex flex-col h-full bg-white px-6 py-12 relative overflow-y-auto overflow-x-hidden">
          <div className="absolute top-[-50px] left-[-50px] w-48 h-48 bg-indigo-100 rounded-full mix-blend-multiply blur-2xl opacity-70 animate-blob"></div>
          <div className="absolute top-[20%] right-[-50px] w-64 h-64 bg-blue-100 rounded-full mix-blend-multiply blur-2xl opacity-70 animate-blob animation-delay-2000"></div>
          
          <div className="flex-1 flex flex-col justify-center items-center z-10 relative">
            <div className="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mb-5 shadow-xl shadow-indigo-200 transform -rotate-6"><BookOpen className="w-8 h-8 text-white" /></div>
            <h1 className="text-3xl font-extrabold text-gray-900 mb-2 tracking-tight">StudyZone</h1>
            <p className="text-gray-500 text-sm font-medium text-center mb-10">우리 동네 믿을 수 있는 스터디 매칭</p>
            
            <form onSubmit={handleLogin} className="w-full space-y-4">
              <div className="space-y-3">
                <div className="relative">
                  <Mail className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5" />
                  <input 
                    type="email" placeholder="이메일 주소" required 
                    className="w-full pl-12 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:bg-white focus:border-indigo-500 text-sm transition-all" 
                    value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} 
                  />
                </div>
                <div className="relative">
                  <Lock className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5" />
                  <input 
                    type={showLoginPassword ? 'text' : 'password'} placeholder="비밀번호" required 
                    className="w-full pl-12 pr-12 py-3.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:bg-white focus:border-indigo-500 text-sm transition-all" 
                    value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} 
                  />
                  <button 
                    type="button" 
                    onClick={() => setShowLoginPassword(!showLoginPassword)}
                    className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors focus:outline-none"
                  >
                    {showLoginPassword ? <EyeOff className="w-5 h-5" /> : <Eye className="w-5 h-5" />}
                  </button>
                </div>
              </div>
              <button type="submit" disabled={isProcessing} className="w-full flex items-center justify-center gap-2 bg-indigo-600 text-white py-3.5 px-4 rounded-xl font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all mt-2 disabled:bg-gray-400 disabled:shadow-none">
                {isProcessing ? <Loader2 className="w-5 h-5 animate-spin text-white" /> : <><LogIn className="w-5 h-5" /> 로그인하기</>}
              </button>
            </form>
          </div>
          
          <div className="pt-6 pb-2 text-center z-10 relative bg-white mt-auto">
            <p className="text-sm text-gray-500">아직 계정이 없으신가요?<button type="button" onClick={() => setCurrentView('signup')} className="ml-2 font-bold text-indigo-600 hover:underline">회원가입하기</button></p>
          </div>
        </div>
      );

      // --- [화면: 회원가입 전용 뷰] ---
      const renderSignUp = () => (
        <div className="flex flex-col h-full bg-white px-6 py-12 relative overflow-y-auto overflow-x-hidden">
          <button onClick={() => setCurrentView('login')} className="absolute top-6 left-4 p-2 z-20 text-gray-600"><ArrowLeft className="w-6 h-6"/></button>
          <div className="flex-1 flex flex-col justify-center z-10 relative mt-4">
            <h1 className="text-3xl font-extrabold text-gray-900 mb-2">시작하기</h1>
            <p className="text-gray-500 text-sm font-medium mb-8">StudyZone 이메일 회원가입</p>
            
            <form onSubmit={handleSignUp} className="w-full space-y-4">
              <div className="space-y-3">
                <div className="relative">
                  <Mail className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5" />
                  <input 
                    type="email" placeholder="이메일 주소" required 
                    className="w-full pl-12 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:bg-white focus:border-indigo-500 text-sm transition-all" 
                    value={signupEmail} onChange={(e) => setSignupEmail(e.target.value)}

                <div className="relative">
                  <Lock className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5" />
                  <input 
                    type={showSignupPassword ? 'text' : 'password'} placeholder="비밀번호 (6자리 이상)" required minLength={6} 
                    className="w-full pl-12 pr-12 py-3.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:bg-white focus:border-indigo-500 text-sm transition-all" 
                    value={signupPassword} onChange={(e) => setSignupPassword(e.target.value)} 
                  />
                  <button 
                    type="button" 
                    onClick={() => setShowSignupPassword(!showSignupPassword)}
                    className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors focus:outline-none"
                  >
                    {showSignupPassword ? <EyeOff className="w-5 h-5" /> : <Eye className="w-5 h-5" />}
                  </button>
                </div>
                <div className="relative">
                  <Lock className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5" />
                  <input

                    className="w-full pl-12 pr-12 py-3.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:bg-white focus:border-indigo-500 text-sm transition-all" 
                    value={signupPasswordConfirm} onChange={(e) => setSignupPasswordConfirm(e.target.value)} 
                  />
                  <button

                    className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors focus:outline-none"

              <button type="submit" disabled={isProcessing} className="w-full flex items-center justify-center gap-2 bg-indigo-600 text-white py-3.5 px-4 rounded-xl font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all mt-4 disabled:bg-gray-400 disabled:shadow-none">

              </button>
            </form>
          </div>
        </div>

      // --- [화면: 온보딩 (회원가입 초기설정)] ---
      const renderOnboarding = () => {
        const totalSteps = 6;
        return (
          <div className="flex flex-col h-full bg-white px-6 py-8 relative">

            <div className="bg-indigo-50 border-b border-indigo-100 p-3 flex items-start gap-2 shadow-sm z-10">
              <Megaphone className="w-4 h-4 text-indigo-600 flex-shrink-0 mt-0.5" />
              <div className="flex-1"><p className="text-xs text-indigo-900 font-bold leading-relaxed">{selectedGroup.notice || '등록된 공지사항이 없습니다.'}</p></div>
              {isHost && <button onClick={() => showModal('공지 수정', '공지 수정 기능은 준비 중입니다.')} className="text-[10px] text-indigo-500 font-bold bg-white px-2 py-1 rounded border border-indigo-200">수정</button>}
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-24" ref={chatScrollRef}>
              <div className="text-center my-4"><span className="bg-black/10 text-gray-600 text-[10px] font-bold px-3 py-1 rounded-full">스터디가 시작되었습니다. 첫 인사를 건네보세요!</span></div>
              {messages.map(msg => {
                const isSystem = msg.uid === 'system';
                if (isSystem) return <div key={msg.id} className="text-center my-2"><span className="bg-rose-50 text-rose-600 text-[11px] font-bold px-3 py-1.5 rounded-full">{msg.text}</span></div>
                const isMe = msg.uid === authUser.uid;
                return (
                  <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'} animate-fade-in-up`}>
                    {!isMe && <span className="text-[11px] text-gray-500 mb-1 ml-1 font-bold">{msg.name}</span>}
                    <div className={`px-4 py-2.5 rounded-2xl max-w-[75%] text-[15px] leading-relaxed shadow-sm ${isMe ? 'bg-indigo-600 text-white rounded-br-sm' : 'bg-white border border-gray-200 text-gray-800 rounded-bl-sm'}`}>{msg.text}</div>
                  </div>
                );
              })}
            </div>

            <form onSubmit={handleSendMessage} className="absolute bottom-0 w-full p-3 bg-white border-t border-gray-200 pb-safe flex gap-2 z-20">
              <input type="text" value={newMessage} onChange={e => setNewMessage(e.target.value)} className="flex-1 bg-gray-100 rounded-full pl-5 pr-4 py-3 outline-none focus:ring-2 focus:ring-indigo-100 transition-all text-[15px] font-medium" placeholder="메시지 보내기..." />
              <button type="submit" disabled={!newMessage.trim()} className="w-12 h-12 bg-indigo-600 text-white rounded-full flex items-center justify-center disabled:bg-gray-300 disabled:shadow-none shadow-md shadow-indigo-200 transition-colors">
                <Send className="w-5 h-5 ml-[-2px] mt-[2px]" />
              </button>
            </form>
          </div>
        );
      };

      return (
        <div className="max-w-md mx-auto h-screen bg-black overflow-hidden font-sans selection:bg-indigo-100 relative shadow-2xl sm:border-x sm:border-gray-200">
          <CustomModal />
          {!isLoggedIn ? (
            currentView === 'signup' ? renderSignUp() : renderLogin()
          ) : (
            currentView === 'onboarding' ? renderOnboarding() :
            currentView === 'editProfile' ? renderEditProfile() :
            currentView === 'verifyStudent' ? renderVerifyStudent() :
            currentView === 'home' ? renderHomeTabs() :
            currentView === 'groupDetail' ? renderGroupDetail() :
            currentView === 'createGroup' ? renderCreateGroup() :
            currentView === 'chat' ? renderChat() : renderHomeTabs()
          )}
        </div>
      );
    }

    // 렌더링
    const rootElement = document.getElementById('root');
    const root = createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
