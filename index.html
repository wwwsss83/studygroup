<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동네 스터디 게시판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#5b4030;
    --board-dark:#4a3427;
    --paper:#faf3e2;
    --paper-shadow:#e8dcc0;
    --ink:#2b2118;
    --ink-soft:#6b5c4a;
    --pin-red:#c1443d;
    --pin-teal:#2f7b6d;
    --pin-mustard:#d9a73b;
    --pin-blue:#3d6fa8;
    --pin-purple:#7a5ba8;
    --pin-gray:#7d7266;
    --pin-green:#5a8f4f;
    --thread:#c9b892;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    background-color:var(--board);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.03) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.08) 0, transparent 40%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 2px, transparent 2px, transparent 4px);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:3px solid var(--pin-mustard);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- header ---------- */
  .board-header{
    padding:36px 20px 20px;
    text-align:center;
    position:relative;
  }
  .board-title{
    font-family:'Gaegu', cursive;
    font-size:44px;
    font-weight:700;
    color:#f6ecd8;
    margin:0;
    text-shadow:0 2px 0 rgba(0,0,0,0.25);
    letter-spacing:1px;
  }
  .board-sub{
    color:#d8c9ab;
    font-size:14px;
    margin-top:6px;
  }
  .region-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:16px;
    background:rgba(0,0,0,0.2);
    border:1px solid rgba(255,255,255,0.15);
    color:#f6ecd8;
    padding:8px 16px;
    border-radius:999px;
    font-size:14px;
    cursor:pointer;
    transition:background 0.15s;
  }
  .region-pill:hover{background:rgba(0,0,0,0.32);}
  .region-pill b{font-weight:700; color:#fff;}

  /* ---------- board / corkboard grid ---------- */
  .board-wrap{
    max-width:1100px;
    margin:0 auto;
    padding:10px 24px 120px;
  }
  .flyer-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:34px 26px;
    padding-top:20px;
  }
  .grade-filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding-top:22px;
  }
  .grade-chip{
    border:1.5px solid rgba(255,255,255,0.25);
    background:rgba(0,0,0,0.18);
    color:#f0e6cf;
    padding:7px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:background 0.15s, border-color 0.15s;
  }
  .grade-chip:hover{ background:rgba(0,0,0,0.3); }
  .grade-chip.selected{
    background:var(--pin-mustard);
    border-color:var(--pin-mustard);
    color:var(--ink);
    font-weight:700;
  }

  .flyer{
    position:relative;
    background:var(--paper);
    padding:26px 20px 20px;
    box-shadow:0 10px 18px rgba(0,0,0,0.28), 0 2px 0 rgba(0,0,0,0.1);
    min-height:220px;
    display:flex;
    flex-direction:column;
    transform:rotate(var(--tilt, -1deg));
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    background-image:
      linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px);
    background-size:100% 26px;
    cursor:pointer;
  }
  .flyer:nth-child(3n){ --tilt: 1.4deg; }
  .flyer:nth-child(3n+1){ --tilt: -1.6deg; }
  .flyer:nth-child(3n+2){ --tilt: 0.6deg; }
  .flyer:hover{
    transform:rotate(0deg) translateY(-4px) scale(1.02);
    box-shadow:0 16px 26px rgba(0,0,0,0.35);
    z-index:5;
  }
  .pin{
    position:absolute;
    top:-12px;
    left:50%;
    transform:translateX(-50%);
    width:20px;
    height:20px;
    border-radius:50%;
    box-shadow:0 3px 4px rgba(0,0,0,0.4), inset -2px -2px 3px rgba(0,0,0,0.25), inset 2px 2px 3px rgba(255,255,255,0.4);
  }
  .cat-국어 .pin{ background:var(--pin-red); }
  .cat-영어 .pin{ background:var(--pin-blue); }
  .cat-수학 .pin{ background:var(--pin-purple); }
  .cat-사회 .pin{ background:var(--pin-mustard); }
  .cat-과학 .pin{ background:var(--pin-teal); }
  .cat-코딩 .pin{ background:var(--pin-green); }
  .cat-기타 .pin{ background:var(--pin-gray); }

  .flyer-badges{
    display:flex;
    gap:6px;
    align-items:center;
    margin-bottom:10px;
  }
  .flyer-cat{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    padding:3px 9px;
    border-radius:3px;
    display:inline-block;
    color:#fff;
  }
  .cat-국어 .flyer-cat{ background:var(--pin-red); }
  .cat-영어 .flyer-cat{ background:var(--pin-blue); }
  .cat-수학 .flyer-cat{ background:var(--pin-purple); }
  .cat-사회 .flyer-cat{ background:var(--pin-mustard); }
  .cat-과학 .flyer-cat{ background:var(--pin-teal); }
  .cat-코딩 .flyer-cat{ background:var(--pin-green); }
  .cat-기타 .flyer-cat{ background:var(--pin-gray); }

  .flyer-grade{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.3px;
    padding:2.5px 8px;
    border-radius:3px;
    display:inline-block;
    color:var(--ink);
    background:transparent;
    border:1.5px solid var(--ink);
  }

  .flyer-title{
    font-family:'Gaegu', cursive;
    font-size:24px;
    font-weight:700;
    margin:0 0 8px;
    line-height:1.25;
    word-break:keep-all;
  }
  .flyer-meta{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:4px;
    display:flex;
    gap:6px;
  }
  .flyer-meta b{color:var(--ink); font-weight:700;}
  .flyer-desc{
    font-size:13.5px;
    line-height:1.55;
    color:var(--ink);
    margin-top:10px;
    flex:1;
    word-break:keep-all;
    white-space:pre-wrap;
  }
  .flyer-footer{
    margin-top:14px;
    padding-top:10px;
    border-top:1px dashed var(--paper-shadow);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:var(--ink-soft);
  }
  .flyer-delete{
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:12px;
    text-decoration:underline;
    padding:2px;
  }
  .flyer-delete:hover{color:var(--pin-red);}

  /* ---------- empty state ---------- */
  .empty-state{
    text-align:center;
    padding:70px 20px;
    color:#f0e6cf;
  }
  .empty-state .big{
    font-family:'Gaegu', cursive;
    font-size:28px;
    margin-bottom:8px;
  }
  .empty-state .small{
    font-size:14px;
    color:#cbb98f;
  }

  /* ---------- floating add button ---------- */
  .fab{
    position:fixed;
    right:26px;
    bottom:26px;
    background:var(--pin-red);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:16px 22px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(0,0,0,0.4);
    display:flex;
    align-items:center;
    gap:8px;
    transition:transform 0.15s, box-shadow 0.15s;
    z-index:20;
  }
  .fab:hover{ transform:translateY(-3px); box-shadow:0 12px 22px rgba(0,0,0,0.45); }

  /* ---------- modal shared ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,14,8,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-card{
    background:var(--paper);
    max-width:440px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    padding:30px 26px 26px;
    position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .modal-card .pin{ top:-12px; }
  .modal-title{
    font-family:'Gaegu', cursive;
    font-size:26px;
    font-weight:700;
    margin:6px 0 18px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field label .req{
    color:var(--pin-red);
    margin-left:2px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    border:1.5px solid var(--paper-shadow);
    background:#fff;
    padding:9px 11px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    border-radius:4px;
    transition:border-color 0.15s, background 0.15s;
  }
  .field input.invalid, .field select.invalid, .field textarea.invalid{
    border-color:var(--pin-red);
    background:#fff5f4;
  }
  .field-error-msg{
    font-size:11.5px;
    color:var(--pin-red);
    margin-top:4px;
  }
  .field textarea{ resize:vertical; min-height:72px; }
  .field-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .field-row .field{ flex:1; min-width:88px; }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn-primary, .btn-secondary{
    flex:1;
    border:none;
    padding:12px;
    border-radius:5px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{ background:var(--pin-red); color:#fff; }
  .btn-primary:hover{ background:#a8362f; }
  .btn-primary:disabled{ background:#c9b3a8; cursor:not-allowed; }
  .btn-secondary{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--paper-shadow); }
  .btn-secondary:hover{ background:rgba(0,0,0,0.04); }
  .field-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .close-x{
    position:absolute;
    top:12px;
    right:14px;
    background:none;
    border:none;
    font-size:20px;
    color:var(--ink-soft);
    cursor:pointer;
    line-height:1;
  }

  .region-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin-top:10px;
  }
  .region-btn{
    border:1.5px solid var(--paper-shadow);
    background:#fff;
    padding:10px 6px;
    border-radius:5px;
    font-size:13.5px;
    cursor:pointer;
    color:var(--ink);
  }
  .region-btn:hover{ border-color:var(--pin-red); color:var(--pin-red); }
  .region-btn.selected{ background:var(--pin-red); border-color:var(--pin-red); color:#fff; }

  .loading-row{
    text-align:center;
    color:#d8c9ab;
    padding:50px 0;
    font-size:14px;
  }

  .flyer-capacity-full{ color:var(--pin-red); font-weight:700; }

  .flyer-join-btn{
    margin-top:14px;
    border:none;
    padding:11px;
    border-radius:5px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    background:var(--pin-teal);
    color:#fff;
    width:100%;
    transition:filter 0.15s, background 0.15s;
  }
  .flyer-join-btn:hover{ filter:brightness(1.08); }
  .flyer-join-btn:disabled{
    background:#c9c2b4;
    color:#6b5c4a;
    cursor:not-allowed;
    filter:none;
  }

  .participant-chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
  }
  .participant-chip{
    background:var(--paper-shadow);
    color:var(--ink);
    padding:4px 10px;
    border-radius:999px;
    font-size:12px;
  }

  .auth-toggle{
    text-align:center;
    margin-top:16px;
  }
  .auth-toggle button{
    background:none;
    border:none;
    color:var(--pin-blue);
    font-weight:700;
    cursor:pointer;
    font-size:12.5px;
    text-decoration:underline;
    padding:0;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:96px;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:6px;
    font-size:13px;
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s, bottom 0.2s;
  }
  .toast.show{ opacity:1; bottom:106px; }

  @media (max-width:520px){
    .board-title{ font-size:32px; }
    .board-wrap{ padding:0 14px 120px; }
    .region-grid{ grid-template-columns:repeat(2, 1fr); }
    .field-row{ flex-direction:column; gap:0; }
  }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "여기에_Project_URL_붙여넣기";
  const SUPABASE_KEY = "여기에_anon_public_key_붙여넣기";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 글 목록 불러오기
  async function loadPosts() {
    const { data, error } = await supabase
      .from('study_groups')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error(error);
      return;
    }
    console.log(data); // 여기서 받은 data를 기존 게시판 렌더링 함수에 넣으면 됩니다
  }

  // 새 글 등록하기
  async function addPost(title, description, location, contact) {
    const { error } = await supabase
      .from('study_groups')
      .insert([{ title, description, location, contact }]);

    if (error) console.error(error);
    else loadPosts(); // 등록 후 목록 새로고침
  }

  loadPosts();
(function(){
  var CATS = ["국어","영어","수학","사회","과학","코딩","기타"];
  var GRADES = ["중1","중2","중3","고1","고2","고3","학년무관"];
  var REGIONS = ["서울","경기","인천","부산","대구","광주","대전","울산","세종",
                  "강원","충북","충남","전북","전남","경북","경남","제주"];

  var state = {
    currentUser: null,
    authMode: 'login',
    myRegion: null,
    posts: [],
    loading: true,
    showCreate: false,
    showRegionPicker: false,
    detailPost: null,
    gradeFilter: '전체',
    error: null
  };

  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function catClass(cat){
    return CATS.indexOf(cat) >= 0 ? 'cat-' + cat : 'cat-기타';
  }

  // ---------- resilient storage layer ----------
  // Tries window.storage first (Claude artifact persistence, shared across
  // everyone who opens the artifact). If that's unavailable — e.g. this file
  // deployed on its own static host — it falls back to the browser's
  // localStorage, so data survives reloads on that same browser/device.
  // If even localStorage is blocked (e.g. private browsing), it falls back
  // to an in-memory store for just this page load.
  var LS_PREFIX = 'studyboard:';
  var memoryStore = { personal:{}, shared:{} };
  var persistWarned = false;

  function warnNoPersist(usingLocalStorage){
    if(!persistWarned){
      persistWarned = true;
      showToast(usingLocalStorage
        ? '이 브라우저에만 저장돼요. 다른 사람과는 공유되지 않아요.'
        : '저장소에 연결할 수 없어 이 화면에서만 임시로 동작해요.');
    }
  }

  function lsAvailable(){
    try{
      var t = '__ls_test__';
      window.localStorage.setItem(t, '1');
      window.localStorage.removeItem(t);
      return true;
    }catch(e){
      return false;
    }
  }

  // window.storage 호출이 (에러 없이) 그냥 응답을 안 주고 멈추는 경우를 대비한 타임아웃.
  // 공유 링크로 들어온 사용자처럼 window.storage에 대한 인증/권한이 없는 경우
  // 에러가 나지 않고 그냥 응답이 안 오는 케이스가 있어서, 일정 시간 안에 응답이 없으면
  // 실패로 간주하고 localStorage/메모리 폴백으로 넘어가도록 함.
  function withTimeout(promise, ms){
    return new Promise(function(resolve, reject){
      var settled = false;
      var timer = setTimeout(function(){
        if(!settled){ settled = true; reject(new Error('storage timed out')); }
      }, ms);
      promise.then(
        function(v){ if(!settled){ settled = true; clearTimeout(timer); resolve(v); } },
        function(e){ if(!settled){ settled = true; clearTimeout(timer); reject(e); } }
      );
    });
  }

  async function storageGet(key, shared){
    try{
      if(!window.storage) throw new Error('storage unavailable');
      return await withTimeout(window.storage.get(key, shared), 6000);
    }catch(e){
      var nsKey = LS_PREFIX + (shared ? 'shared:' : 'personal:') + key;
      if(lsAvailable()){
        var lsVal = window.localStorage.getItem(nsKey);
        if(lsVal !== null){
          return { key: key, value: lsVal, shared: shared };
        }
      }
      var store = shared ? memoryStore.shared : memoryStore.personal;
      if(Object.prototype.hasOwnProperty.call(store, key)){
        return { key: key, value: store[key], shared: shared };
      }
      throw e;
    }
  }

  async function storageSet(key, value, shared){
    try{
      if(!window.storage) throw new Error('storage unavailable');
      var r = await withTimeout(window.storage.set(key, value, shared), 6000);
      if(!r) throw new Error('empty result from storage.set');
      return r;
    }catch(e){
      console.error('storage.set falling back:', e);
      var nsKey = LS_PREFIX + (shared ? 'shared:' : 'personal:') + key;
      if(lsAvailable()){
        try{
          window.localStorage.setItem(nsKey, value);
          warnNoPersist(true);
          return { key: key, value: value, shared: shared };
        }catch(lsErr){ /* fall through to memory */ }
      }
      warnNoPersist(false);
      var store = shared ? memoryStore.shared : memoryStore.personal;
      store[key] = value;
      return { key: key, value: value, shared: shared };
    }
  }

  async function storageDelete(key, shared){
    try{
      if(!window.storage) throw new Error('storage unavailable');
      return await withTimeout(window.storage.delete(key, shared), 6000);
    }catch(e){
      var nsKey = LS_PREFIX + (shared ? 'shared:' : 'personal:') + key;
      if(lsAvailable()){
        window.localStorage.removeItem(nsKey);
      }
      var store = shared ? memoryStore.shared : memoryStore.personal;
      delete store[key];
      return { key: key, deleted: true, shared: shared };
    }
  }

  async function storageList(prefix, shared){
    try{
      if(!window.storage) throw new Error('storage unavailable');
      return await withTimeout(window.storage.list(prefix, shared), 6000);
    }catch(e){
      var nsPrefix = LS_PREFIX + (shared ? 'shared:' : 'personal:') + (prefix || '');
      var keys = [];
      if(lsAvailable()){
        for(var i=0;i<window.localStorage.length;i++){
          var fullKey = window.localStorage.key(i);
          if(fullKey && fullKey.indexOf(nsPrefix) === 0){
            keys.push(fullKey.slice(LS_PREFIX.length + (shared ? 7 : 9)));
          }
        }
      }
      var store = shared ? memoryStore.shared : memoryStore.personal;
      Object.keys(store).forEach(function(k){
        if((!prefix || k.indexOf(prefix) === 0) && keys.indexOf(k) === -1){
          keys.push(k);
        }
      });
      return { keys: keys, prefix: prefix, shared: shared };
    }
  }

  // ---------- auth (this browser / this Claude 계정에만 저장됨) ----------
  async function hashPassword(pw){
    try{
      if(window.crypto && window.crypto.subtle && window.crypto.subtle.digest){
        var enc = new TextEncoder().encode(pw);
        var buf = await window.crypto.subtle.digest('SHA-256', enc);
        return 'sha256:' + Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      }
    }catch(e){
      /* crypto.subtle을 쓸 수 없는 환경 (예: 샌드박스) -> 아래 폴백으로 진행 */
    }
    // 폴백: SubtleCrypto가 막힌 환경에서도 로그인이 동작하도록 하는 간단한 해시.
    // 실제 서비스 수준의 보안 강도는 아니며, 이 데모 게시판에서 계정 구분 용도로만 씀.
    var hash = 0;
    for(var i=0;i<pw.length;i++){
      hash = ((hash << 5) - hash) + pw.charCodeAt(i);
      hash |= 0;
    }
    return 'fb:' + Math.abs(hash).toString(16) + ':' + pw.length;
  }

  async function loadSession(){
    try{
      var s = await storageGet('session', false);
      if(s && s.value){
        var accRes = await storageGet('account:' + s.value, false);
        if(accRes && accRes.value){
          var acc = JSON.parse(accRes.value);
          state.currentUser = { id: acc.id, nickname: acc.nickname, contact: acc.contact || '' };
        }
      }
    }catch(e){ /* 로그인 안 된 상태 */ }
  }

  async function registerAccount(id, password, nickname, contact){
    var existing = null;
    try{ existing = await storageGet('account:' + id, false); }catch(e){ existing = null; }
    if(existing && existing.value){
      return { ok:false, reason:'duplicate' };
    }
    var hash = await hashPassword(password);
    var acc = { id:id, passwordHash:hash, nickname:nickname, contact:contact || '' };
    await storageSet('account:' + id, JSON.stringify(acc), false);
    await storageSet('session', id, false);
    return { ok:true, account: acc };
  }

  async function loginAccount(id, password){
    var res;
    try{ res = await storageGet('account:' + id, false); }catch(e){ res = null; }
    if(!res || !res.value){
      return { ok:false, reason:'notfound' };
    }
    var acc = JSON.parse(res.value);
    var hash = await hashPassword(password);
    if(hash !== acc.passwordHash){
      return { ok:false, reason:'wrongpw' };
    }
    await storageSet('session', id, false);
    return { ok:true, account: acc };
  }

  // 이 브라우저(또는 이 Claude 계정)에 저장된 아이디/비밀번호 계정을 전부 삭제.
  // 게시글(스터디 글) 데이터는 건드리지 않음 - 로그인 정보만 초기화.
  async function resetAllAccounts(){
    try{
      var listRes = await storageList('account:', false);
      var keys = (listRes && listRes.keys) ? listRes.keys : [];
      for(var i=0;i<keys.length;i++){
        try{ await storageDelete(keys[i], false); }catch(e){ /* skip */ }
      }
      try{ await storageDelete('session', false); }catch(e){ /* ignore */ }
    }catch(e){
      console.error('resetAllAccounts failed:', e);
    }
    // window.storage/서버 쪽에서 지워지지 않았을 수도 있는 로컬 폴백 흔적까지 확실히 제거
    try{
      if(lsAvailable()){
        for(var i2 = window.localStorage.length - 1; i2 >= 0; i2--){
          var k = window.localStorage.key(i2);
          if(k && k.indexOf(LS_PREFIX + 'personal:account:') === 0){
            window.localStorage.removeItem(k);
          }
        }
        window.localStorage.removeItem(LS_PREFIX + 'personal:session');
      }
    }catch(e){ /* ignore */ }
    memoryStore.personal = {};
    state.currentUser = null;
    state.authMode = 'login';
    render();
    showToast('로그인 정보를 모두 초기화했어요.');
  }

  async function loadPosts(){
    state.loading = true;
    render();
    try{
      var listRes = await storageList('group:', true);
      var keys = (listRes && listRes.keys) ? listRes.keys : [];
      var posts = [];
      for(var i=0;i<keys.length;i++){
        try{
          var r = await storageGet(keys[i], true);
          if(r && r.value){
            var parsed = JSON.parse(r.value);
            parsed.participants = parsed.participants || [];
            posts.push(parsed);
          }
        }catch(e){ /* skip broken entry */ }
      }
      posts.sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
      state.posts = posts;
      state.error = null;
    }catch(e){
      state.error = '게시글을 불러오지 못했어요. 잠시 후 다시 시도해주세요.';
    }
    state.loading = false;
    render();
  }

  // authorId가 있는 글(로그인 기능 도입 이후 작성된 글)은 작성자 본인만 삭제 가능.
  // authorId가 없는 옛 글(로그인 기능 도입 이전 데이터)은 기존 닉네임 확인 방식을 그대로 허용.
  function canDeletePost(post){
    if(post.authorId){
      return !!(state.currentUser && state.currentUser.id === post.authorId);
    }
    return true;
  }

  async function deletePost(post){
    if(post.authorId){
      if(!state.currentUser || state.currentUser.id !== post.authorId){
        showToast('본인이 작성한 글만 삭제할 수 있어요.');
        return;
      }
      if(!confirm('"' + post.title + '" 글을 삭제할까요?')) return;
    } else {
      var typed = prompt('삭제하려면 작성 시 입력한 닉네임 "' + post.nickname + '"을(를) 그대로 입력해주세요.');
      if(typed === null) return;
      if(typed !== post.nickname){
        showToast('닉네임이 일치하지 않아요.');
        return;
      }
    }
    await storageDelete(post.id, true);
    state.posts = state.posts.filter(function(p){ return p.id !== post.id; });
    if(state.detailPost && state.detailPost.id === post.id){
      state.detailPost = null;
    }
    render();
    showToast('게시글을 뗐어요.');
  }

  // 정원이 숫자로 지정된 경우 그 숫자를, "인원 협의" 등 숫자가 아니면 null(정원 무제한)을 반환
  function capacityNumber(post){
    var n = parseInt(post.capacity, 10);
    return isNaN(n) ? null : n;
  }

  function isPostFull(post){
    var cap = capacityNumber(post);
    if(cap === null) return false;
    return (post.participants || []).length >= cap;
  }

  async function joinPost(post){
    if(!state.currentUser){
      showToast('참여하려면 로그인이 필요해요.');
      return;
    }
    post.participants = post.participants || [];
    var already = post.participants.some(function(p){
      return p && typeof p === 'object' && p.id === state.currentUser.id;
    });
    if(already){
      showToast('이미 참여했어요.');
      return;
    }
    var cap = capacityNumber(post);
    if(cap !== null && post.participants.length >= cap){
      showToast('정원이 모두 찼어요.');
      render();
      return;
    }
    post.participants.push({ id: state.currentUser.id, nickname: state.currentUser.nickname });
    try{
      await storageSet(post.id, JSON.stringify(post), true);
      showToast('참여 완료! 🎉');
    }catch(e){
      post.participants.pop();
      showToast('참여 처리에 실패했어요. 다시 시도해주세요.');
    }
    render();
  }

  function regionPosts(){
    return state.posts.filter(function(p){ return p.region === state.myRegion; });
  }

  function displayedPosts(){
    var posts = regionPosts();
    if(state.gradeFilter === '전체') return posts;
    return posts.filter(function(p){ return p.grade === state.gradeFilter || p.grade === '학년무관'; });
  }

    contactInput.maxLength = 100;
    contactInput.placeholder = '오픈채팅 링크, 이메일 등';
    if(state.currentUser && state.currentUser.contact) contactInput.value = state.currentUser.contact;
    row2.appendChild(field('연락 방법', contactInput, null, true));
    form.appendChild(row2);

    var actions = document.createElement('div');
    actions.className = 'modal-actions';
    var cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'btn-secondary';
    cancelBtn.textContent = '취소';
    cancelBtn.addEventListener('click', function(){ state.showCreate = false; render(); });

    var submitBtn = document.createElement('button');
    submitBtn.type = 'submit';
    submitBtn.className = 'btn-primary';
    submitBtn.textContent = '게시판에 붙이기';

    actions.appendChild(cancelBtn);
    actions.appendChild(submitBtn);
    form.appendChild(actions);

    [titleInput, nickInput, contactInput].forEach(function(inp){
      inp.addEventListener('input', function(){ inp.classList.remove('invalid'); });
    });

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      var missing = [];
      [[titleInput,'제목'], [nickInput,'닉네임'], [contactInput,'연락 방법']].forEach(function(pair){
        if(!pair[0].value.trim()){
          pair[0].classList.add('invalid');
          missing.push(pair[1]);
        } else {
          pair[0].classList.remove('invalid');
        }
      });
      if(missing.length){
        showToast(missing.join(', ') + ' 항목을 입력해주세요.');
        missing[0] === '제목' ? titleInput.focus() : (missing[0] === '닉네임' ? nickInput.focus() : contactInput.focus());
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = '등록 중...';
      var ok = await createPost({
        title: titleInput.value.trim(),
        category: catSelect.value,
        grade: gradeSelect.value,
        schedule: schedInput.value.trim() || '일정 협의',
        capacity: capInput.value ? capInput.value : '인원 협의',
        description: descInput.value.trim(),
        nickname: nickInput.value.trim(),
        contact: contactInput.value.trim()
      });
      if(!ok){
        submitBtn.disabled = false;
        submitBtn.textContent = '게시판에 붙이기';
      }
    });

    card.appendChild(form);
    wrap.appendChild(card);
    return wrap;
  }

  function renderDetailModal(post){
    var wrap = document.createElement('div');
    wrap.className = 'modal-overlay';
    wrap.addEventListener('click', function(e){
      if(e.target === wrap){ state.detailPost = null; render(); }
    });

    var card = document.createElement('div');
    card.className = 'modal-card';

    var pin = document.createElement('div');
    pin.className = 'pin';
    pin.style.background = 'var(--pin-teal)';
    card.appendChild(pin);

    var closeBtn = document.createElement('button');
    closeBtn.className = 'close-x';
    closeBtn.textContent = '✕';
    closeBtn.addEventListener('click', function(){ state.detailPost = null; render(); });
    card.appendChild(closeBtn);

    var badges = document.createElement('div');
    badges.className = 'flyer-badges';
    var cat = document.createElement('span');
    cat.className = 'flyer-cat';
    cat.textContent = post.category;
    badges.appendChild(cat);
    if(post.grade){
      var grade = document.createElement('span');
      grade.className = 'flyer-grade';
      grade.textContent = post.grade;
      badges.appendChild(grade);
    }
    card.appendChild(badges);

    var title = document.createElement('div');
    title.className = 'modal-title';
    title.textContent = post.title;
    card.appendChild(title);

    var meta1 = document.createElement('div');
    meta1.className = 'flyer-meta';
    meta1.innerHTML = '🗓 <b>' + escapeHtml(post.schedule) + '</b>';
    card.appendChild(meta1);

    var cap = capacityNumber(post);
    var joined = (post.participants || []).length;
    var meta2 = document.createElement('div');
    meta2.className = 'flyer-meta';
    meta2.innerHTML = cap !== null
      ? '👥 <b>' + joined + ' / ' + cap + '명</b> 참여 중' + (joined >= cap ? ' <span class="flyer-capacity-full">· 정원 마감</span>' : '')
      : '👥 참여 ' + joined + '명 · 인원 협의';
    card.appendChild(meta2);

    if(post.description){
      var desc = document.createElement('div');
      desc.className = 'flyer-desc';
      desc.style.marginTop = '10px';
      desc.textContent = post.description;
      card.appendChild(desc);
    }

    var who = document.createElement('div');
    who.className = 'flyer-meta';
    who.style.marginTop = '12px';
    who.innerHTML = '✍️ ' + escapeHtml(post.nickname) + ' · ' + escapeHtml(post.contact);
    card.appendChild(who);

    if(joined > 0){
      var chipRow = document.createElement('div');
      chipRow.className = 'participant-chip-row';
      post.participants.forEach(function(n){
        var chip = document.createElement('span');
        chip.className = 'participant-chip';
        chip.textContent = (n && typeof n === 'object') ? n.nickname : n;
        chipRow.appendChild(chip);
      });
      card.appendChild(chipRow);
    }

    var full = isPostFull(post);
    var alreadyJoined = !!(state.currentUser && post.participants.some(function(p){
      return p && typeof p === 'object' && p.id === state.currentUser.id;
    }));
    var joinBtn = document.createElement('button');
    joinBtn.className = 'flyer-join-btn';
    if(alreadyJoined){
      joinBtn.textContent = '이미 참여했어요 ✓';
      joinBtn.disabled = true;
    } else if(full){
      joinBtn.textContent = '정원이 마감됐어요';
      joinBtn.disabled = true;
    } else {
      joinBtn.textContent = '참여하기';
      joinBtn.disabled = false;
    }
    joinBtn.addEventListener('click', function(){ joinPost(post); });
    card.appendChild(joinBtn);

    if(canDeletePost(post)){
      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn-secondary';
      delBtn.style.width = '100%';
      delBtn.style.marginTop = '10px';
      delBtn.textContent = '이 글 삭제하기';
      delBtn.addEventListener('click', function(){ deletePost(post); });
      card.appendChild(delBtn);
    }

    wrap.appendChild(card);
    return wrap;
  }

  function renderFlyer(post){
    var f = document.createElement('div');
    f.className = 'flyer ' + catClass(post.category);
    f.addEventListener('click', function(){ state.detailPost = post; render(); });

    var pin = document.createElement('div');
    pin.className = 'pin';
    f.appendChild(pin);

    var badges = document.createElement('div');
    badges.className = 'flyer-badges';

    var cat = document.createElement('span');
    cat.className = 'flyer-cat';
    cat.textContent = post.category;
    badges.appendChild(cat);

    if(post.grade){
      var grade = document.createElement('span');
      grade.className = 'flyer-grade';
      grade.textContent = post.grade;
      badges.appendChild(grade);
    }
    f.appendChild(badges);

    var title = document.createElement('h3');
    title.className = 'flyer-title';
    title.textContent = post.title;
    f.appendChild(title);

    var meta1 = document.createElement('div');
    meta1.className = 'flyer-meta';
    meta1.innerHTML = '🗓 <b>' + escapeHtml(post.schedule) + '</b>';
    f.appendChild(meta1);

    var cardCap = capacityNumber(post);
    var cardJoined = (post.participants || []).length;
    var meta2 = document.createElement('div');
    meta2.className = 'flyer-meta';
    meta2.innerHTML = cardCap !== null
      ? '👥 ' + cardJoined + ' / ' + cardCap + '명' + (cardJoined >= cardCap ? ' <span class="flyer-capacity-full">· 마감</span>' : '')
      : '👥 참여 ' + cardJoined + '명 · 인원 협의';
    f.appendChild(meta2);

    if(post.description){
      var desc = document.createElement('div');
      desc.className = 'flyer-desc';
      desc.textContent = post.description;
      f.appendChild(desc);
    }

    var footer = document.createElement('div');
    footer.className = 'flyer-footer';
    var who = document.createElement('span');
    who.textContent = post.nickname + ' · ' + post.contact;
    who.style.overflow = 'hidden';
    who.style.textOverflow = 'ellipsis';
    who.style.whiteSpace = 'nowrap';
    who.style.maxWidth = '75%';
    footer.appendChild(who);

    if(canDeletePost(post)){
      var del = document.createElement('button');
      del.className = 'flyer-delete';
      del.textContent = '삭제';
      del.addEventListener('click', function(e){ e.stopPropagation(); deletePost(post); });
      footer.appendChild(del);
    }

    f.appendChild(footer);
    return f;
  }

  function render(){
    app.innerHTML = '';

    // Header
    var header = document.createElement('div');
    header.className = 'board-header';

    var h1 = document.createElement('h1');
    h1.className = 'board-title';
    h1.textContent = '📌 동네 스터디 게시판';
    header.appendChild(h1);

    var sub = document.createElement('div');
    sub.className = 'board-sub';
    sub.textContent = '중고등학생을 위한, 우리 동네에서만 보이는 스터디 모집 코르크보드';
    header.appendChild(sub);

    if(state.currentUser){
      var userPill = document.createElement('button');
      userPill.className = 'region-pill';
      userPill.innerHTML = '👤 <b>' + escapeHtml(state.currentUser.nickname) + '</b>님 &nbsp;·&nbsp; 로그아웃';
      userPill.addEventListener('click', function(){ logout(); });
      header.appendChild(userPill);
    }

    if(state.myRegion){
      var pill = document.createElement('button');
      pill.className = 'region-pill';
      pill.innerHTML = '📍 지금 보는 동네: <b>' + escapeHtml(state.myRegion) + '</b> &nbsp;·&nbsp; 변경';
      pill.addEventListener('click', function(){ state.showRegionPicker = true; render(); });
      header.appendChild(pill);
    }

    app.appendChild(header);

    // Body
    var wrap = document.createElement('div');
    wrap.className = 'board-wrap';

    if(state.loading){
      var loadingRow = document.createElement('div');
      loadingRow.className = 'loading-row';
      loadingRow.textContent = '게시판을 불러오는 중...';
      wrap.appendChild(loadingRow);
    } else if(state.error){
      var errRow = document.createElement('div');
      errRow.className = 'loading-row';
      errRow.textContent = state.error;
      wrap.appendChild(errRow);
    } else {
      var chipRow = document.createElement('div');
      chipRow.className = 'grade-filter-row';
      ['전체'].concat(GRADES.filter(function(g){ return g !== '학년무관'; })).forEach(function(g){
        var chip = document.createElement('button');
        chip.className = 'grade-chip' + (state.gradeFilter === g ? ' selected' : '');
        chip.textContent = g;
        chip.addEventListener('click', function(){ state.gradeFilter = g; render(); });
        chipRow.appendChild(chip);
      });
      wrap.appendChild(chipRow);

      var posts = displayedPosts();
      if(posts.length === 0){
        var empty = document.createElement('div');
        empty.className = 'empty-state';
        var emptyLine = state.gradeFilter === '전체'
          ? '아직 ' + escapeHtml(state.myRegion) + '엔 스터디가 없어요'
          : escapeHtml(state.myRegion) + ' · ' + escapeHtml(state.gradeFilter) + ' 스터디가 아직 없어요';
        empty.innerHTML = '<div class="big">' + emptyLine + '</div>' +
                           '<div class="small">첫 번째 스터디를 올려서 동네 친구들을 모아보세요</div>';
        wrap.appendChild(empty);
      } else {
        var grid = document.createElement('div');
        grid.className = 'flyer-grid';
        posts.forEach(function(p){ grid.appendChild(renderFlyer(p)); });
        wrap.appendChild(grid);
      }
    }

    app.appendChild(wrap);

    // FAB
    if(state.currentUser && state.myRegion && !state.loading){
      var fab = document.createElement('button');
      fab.className = 'fab';
      fab.innerHTML = '➕ 스터디 올리기';
      fab.addEventListener('click', function(){ state.showCreate = true; render(); });
      app.appendChild(fab);
    }

    // Modals
    if(!state.currentUser){
      app.appendChild(renderAuthModal());
    } else if(!state.myRegion){
      app.appendChild(renderRegionPickerModal(true));
    } else if(state.showRegionPicker){
      app.appendChild(renderRegionPickerModal(false));
    } else if(state.showCreate){
      app.appendChild(renderCreateModal());
    } else if(state.detailPost){
      app.appendChild(renderDetailModal(state.detailPost));
    }
  }

  async function init(){
    render();
    await loadSession();
    render();
    await loadMyRegion();
    render();
    if(state.currentUser && state.myRegion){
      await loadPosts();
    } else {
      state.loading = false;
      render();
    }
  }

  // watch region changes to (re)load posts
  var _setMyRegion = setMyRegion;
  setMyRegion = async function(region){
    await _setMyRegion(region);
    if(state.posts.length === 0){
      await loadPosts();
    }
  };

  init();
})();
</script>
</body>
</html>
